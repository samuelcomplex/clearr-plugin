name: Compatibility check

# Weekly: builds the plugin against current and upcoming Jellyfin packages, then installs the
# release build into REAL Jellyfin containers and checks it loads and its API answers.
# Clearr's own repo tests the shared engine end-to-end against real Sonarr/Radarr.
# Pre-releases run as a non-failing early warning. On failure it opens a GitHub issue.

on:
  schedule:
    - cron: "17 5 * * 1"
  workflow_dispatch:

permissions:
  contents: read
  issues: write

jobs:
  build:
    name: Build · Jellyfin ${{ matrix.label }}
    runs-on: ubuntu-latest
    continue-on-error: ${{ matrix.experimental }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - { label: "10.11.x",        version: "10.11.*", tfm: net9.0,  experimental: false }
          - { label: "12.x",           version: "12.*",    tfm: net10.0, experimental: false }
          - { label: "newest release", version: "*",       tfm: net10.0, experimental: false }
          - { label: "pre-release",    version: "*-*",     tfm: net10.0, experimental: true }
    steps:
      - uses: actions/checkout@v5
        with:
          submodules: true
      - run: git submodule update --remote external/clearr
      - uses: actions/setup-dotnet@v5
        with:
          dotnet-version: |
            9.0.x
            10.0.x
      - run: dotnet build src/Jellyfin.Plugin.Clearr -c Release "-p:JellyfinVersion=${{ matrix.version }}" "-p:JellyfinTargetFramework=${{ matrix.tfm }}"
      - if: always()
        run: grep -o '"Jellyfin.Controller/[^"]*"' src/Jellyfin.Plugin.Clearr/obj/project.assets.json | head -1 || true

  load:
    name: Loads in Jellyfin ${{ matrix.jellyfin }}
    runs-on: ubuntu-latest
    continue-on-error: ${{ matrix.experimental }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - { jellyfin: "10.11.11", experimental: false }
          - { jellyfin: latest,     experimental: false }
          - { jellyfin: unstable,   experimental: true }
    steps:
      - uses: actions/checkout@v5
        with:
          submodules: true
      - run: git submodule update --remote external/clearr
      - uses: actions/setup-dotnet@v5
        with:
          dotnet-version: 10.0.x
      - name: Build release DLLs (Jellyfin 10.11 references, like the published package)
        run: dotnet build src/Jellyfin.Plugin.Clearr -c Release -o out
      - name: Start Jellyfin with the plugin installed
        run: |
          P="$RUNNER_TEMP/jf/plugins/Clearr_9.9.9.9"
          mkdir -p "$P" "$RUNNER_TEMP/media"
          cp out/Jellyfin.Plugin.Clearr.dll out/Clearr.Core.dll "$P/"
          echo '{"guid":"94d2b53c-7f01-48dd-8726-c645ebe5ff9b","name":"Clearr","version":"9.9.9.9","targetAbi":"10.11.0.0","status":"Active","assemblies":["Jellyfin.Plugin.Clearr.dll","Clearr.Core.dll"]}' > "$P/meta.json"
          docker run -d --name jellyfin -p 8096:8096 -v "$RUNNER_TEMP/jf:/config" -v "$RUNNER_TEMP/media:/media" jellyfin/jellyfin:${{ matrix.jellyfin }}
      - name: Check the plugin
        run: bash tests/jellyfin-load-test.sh http://localhost:8096
      - name: Jellyfin log
        if: always()
        run: docker logs jellyfin 2>&1 | grep -iE "clearr|plugin|error" | tail -60

  report:
    name: Open issue on failure
    needs: [build, load]
    if: failure()
    runs-on: ubuntu-latest
    steps:
      - uses: actions/github-script@v8
        with:
          script: |
            const title = 'Compatibility check failed';
            const run = `${context.serverUrl}/${context.repo.owner}/${context.repo.repo}/actions/runs/${context.runId}`;
            const body = `The weekly compatibility check failed: ${run}\n\nOpen the run to see which Jellyfin version broke and the exact error.`;
            const open = await github.rest.issues.listForRepo({ ...context.repo, state: 'open', labels: 'compatibility' });
            const existing = open.data.find(i => i.title === title);
            if (existing) {
              await github.rest.issues.createComment({ ...context.repo, issue_number: existing.number, body });
            } else {
              await github.rest.issues.create({ ...context.repo, title, body, labels: ['compatibility'] });
            }
