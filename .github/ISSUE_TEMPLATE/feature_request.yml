name: Idea or feature request
description: Suggest something Clearr could do
labels: [enhancement]
body:
  - type: textarea
    id: problem
    attributes:
      label: What would you like to do?
      description: Describe the situation in your household or setup, not just the feature. That makes it easier to find the right solution.
    validations:
      required: true
  - type: textarea
    id: idea
    attributes:
      label: How could Clearr help?
